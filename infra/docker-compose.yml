services:
  postgres:
    image: postgres:15-alpine
    container_name: researchprep_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: researchprep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: researchprep_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: researchprep_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/researchprep
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=researchprepai-secret-production-key-change-me-32bytes
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_samplekey123}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_samplesecret123}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-whsec_sample123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: researchprep_celery
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/researchprep
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=researchprepai-secret-production-key-change-me-32bytes
    depends_on:
      - backend
      - redis
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: researchprep_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
